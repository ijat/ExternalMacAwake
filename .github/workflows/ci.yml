name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Bundle
        run: make zip

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: ExternalMacAwake-app
          path: build/ExternalMacAwake-*.zip
          if-no-files-found: error
