name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Check tag matches VERSION
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match VERSION v$version" >&2
            exit 1
          fi

      - name: Test
        run: make test

      - name: Bundle
        run: make zip

      - name: Checksum
        run: |
          cd build
          shasum -a 256 ExternalMacAwake-*.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" \
            --title "ExternalMacAwake $TAG" \
            --generate-notes \
            build/ExternalMacAwake-*.zip \
            build/SHA256SUMS.txt
